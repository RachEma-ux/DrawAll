name: Contrôle

# Contrôle de qualité à chaque poussée et demande de fusion : types, lint, tests,
# build, lisibilité des DXF (ezdxf) et des PDF (pypdf) exportés par des lecteurs stricts, et recette
# navigateur Playwright (ordinateur et téléphone).
# Indépendant du workflow de déploiement (main.yml).

on:
  push:
    branches: [main]
  pull_request:

# Une seule exécution par branche : une nouvelle poussée annule la précédente.
concurrency:
  group: controle-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund

      - name: Vérifier les types
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Tests (et export des DXF et PDF de référence)
        run: npm test
        env:
          DXF_FIXTURES_DIR: ${{ runner.temp }}/dxf
          PDF_FIXTURES_DIR: ${{ runner.temp }}/pdf

      - name: Lire les DXF exportés avec ezdxf
        run: |
          python3 -m pip install --quiet ezdxf
          python3 scripts/check-dxf.py "${{ runner.temp }}/dxf"

      - name: Lire les PDF exportés avec pypdf (lecture stricte, format)
        run: |
          python3 -m pip install --quiet pypdf
          python3 scripts/check-pdf.py "${{ runner.temp }}/pdf"

      - name: Build
        run: npm run build

      - name: Cache des navigateurs Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Les bibliothèques système de Chromium sont déjà présentes sur ubuntu-latest :
      # on ne télécharge que le navigateur (l'installation apt pouvait bloquer de longues minutes).
      - name: Installer Chromium pour la recette
        timeout-minutes: 5
        run: npx playwright install chromium

      - name: Recette navigateur (ordinateur et téléphone)
        run: npm run e2e

      - name: Rapport de recette
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-recette-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore
