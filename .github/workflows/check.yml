name: Contrôle

# Contrôle de qualité à chaque poussée et demande de fusion : types, lint, tests,
# build, lisibilité des DXF exportés par un lecteur strict (ezdxf) et recette
# navigateur Playwright (ordinateur et téléphone).
# Indépendant du workflow de déploiement (main.yml).

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund

      - name: Vérifier les types
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Tests (et export des DXF de référence)
        run: npm test
        env:
          DXF_FIXTURES_DIR: ${{ runner.temp }}/dxf

      - name: Lire les DXF exportés avec ezdxf
        run: |
          python3 -m pip install --quiet ezdxf
          python3 scripts/check-dxf.py "${{ runner.temp }}/dxf"

      - name: Build
        run: npm run build

      - name: Installer Chromium pour la recette
        run: npx playwright install --with-deps chromium

      - name: Recette navigateur (ordinateur et téléphone)
        run: npm run e2e

      - name: Rapport de recette
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-recette-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore
